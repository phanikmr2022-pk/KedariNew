<html>
<head>
  <title>Kedari ❤️</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle, pink, red);
      overflow: hidden;
      font-family: cursive;
      color: white;
      text-align: center;
    }

    h1 {
      font-size: 50px;
      text-shadow: 0 0 20px white;
    }

    button {
      padding: 12px 25px;
      font-size: 18px;
      border: none;
      border-radius: 25px;
      background: white;
      color: red;
      cursor: pointer;
      margin-top: 20px;
    }

    .heart {
      position: absolute;
      color: pink;
      font-size: 20px;
      animation: floatUp 5s linear infinite;
    }

    @keyframes floatUp {
      0% { transform: translateY(0); opacity: 1; }
      100% { transform: translateY(-100vh); opacity: 0; }
    }
  </style>
</head>

<body>

  <div>
    <h1>❤️ 𝓚𝓮𝓭𝓪𝓻𝓲 ❤️</h1>
    <button onclick="startLove()">Click Me 💖</button>
  </div>

  <audio id="music" loop>
    <source src="https://www2.cs.uic.edu/~i101/SoundFiles/StarWars60.wav" type="audio/wav">
  </audio>

  <script>
    function startLove() {
      document.getElementById("music").play();

      setInterval(() => {
        let heart = document.createElement("div");
        heart.className = "heart";
        heart.innerHTML = "❤️";
        heart.style.left = Math.random() * 100 + "vw";
        heart.style.fontSize = (20 + Math.random() * 30) + "px";

        document.body.appendChild(heart);

        setTimeout(() => {
          heart.remove();
        }, 5000);
      }, 300);
    }
  </script>

</body>
</html>
